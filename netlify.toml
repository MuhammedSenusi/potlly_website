# Netlify deployment configuration.
#
# This is a static export of a Next.js 16 app. The build writes plain deployable
# files to `out`, so Netlify does not need a Next.js runtime adapter. Publishing
# `.next` instead is what produced Netlify's default "Page not found" page: that
# directory has no index.html, and the adapter that would otherwise serve the
# routes was not running.
#
# Netlify only detects `bun.lockb` when choosing a package manager, and this repo
# commits the newer text-format `bun.lock`. Without an explicit install step
# Netlify falls back to `npm install`, which resolves dependencies from the
# semver ranges in package.json and ignores the lockfile entirely. Running
# `bun install` in the build command keeps CI on the versions in `bun.lock`.

[build]
  command = "bun install --frozen-lockfile && bun run build"
  publish = "out"

[build.environment]
  # Match the local toolchain. Next 16 requires Node >= 20.9.
  NODE_VERSION = "22"
  BUN_VERSION = "1.3.9"

# Local `netlify dev` — mirrors `bun run dev`.
[dev]
  command = "bun run dev"
  targetPort = 3000
  framework = "#custom"

# `next build` with `output: "export"` writes the generated metadata images as
# extensionless files (`out/opengraph-image`, `out/apple-icon`), and Netlify
# infers Content-Type from the file extension. Without these rules both PNGs go
# out as the wrong type, which breaks social link previews and the iOS
# home-screen icon. The query string Next appends to the URLs does not affect
# path matching here.

[[headers]]
  for = "/opengraph-image"
  [headers.values]
    Content-Type = "image/png"

[[headers]]
  for = "/apple-icon"
  [headers.values]
    Content-Type = "image/png"
