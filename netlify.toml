# Netlify deployment configuration.
#
# This is a Next.js 16 app. Netlify detects Next.js and automatically installs
# and enables the Next.js Runtime (@netlify/plugin-nextjs) — it does not need to
# be added to devDependencies or listed under [[plugins]] here.
#
# The lockfile is bun.lock, so Netlify installs dependencies with Bun.

[build]
  command = "bun run build"
  publish = ".next"

[build.environment]
  # Match the local toolchain. Next 16 requires Node >= 20.9.
  NODE_VERSION = "22"
  BUN_VERSION = "1.3.9"

# Local `netlify dev` — mirrors `bun run dev`.
[dev]
  command = "bun run dev"
  targetPort = 3000
  framework = "#custom"
